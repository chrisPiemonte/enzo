[project]
name = "gateway"
version = "0.1.0"
description = "Enzo – centralised model gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk>=1.2.2",
    "anthropic>=1.13.0",
    "core",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.28.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
gateway = "gateway.main:run"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
