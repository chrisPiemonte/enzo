[project]
name = "core"
version = "0.1.0"
description = "Enzo – core models, ports and adapters shared by the agent and every service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "mlflow>=3.17.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[tool.uv.build-backend]
module-name = "core"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
