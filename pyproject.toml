[tool.uv.workspace]
members = ["enzo", "core", "evals", "services/*"]

[tool.pylint.main]
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.imports]
# The core/ folder at the repo root would make pylint treat `core` as local; it is an installed dependency.
known-third-party = ["core"]

[tool.pylint."messages control"]
# unused-argument: MOCK, mock functions ignore their arguments; re-enable once the real implementations land.
# too-few-public-methods: ports and adapters do one thing by design (single responsibility).
disable = ["unused-argument", "too-few-public-methods"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.parameter_documentation]
default-docstring-type = "google"
accept-no-param-doc = false
accept-no-return-doc = false
accept-no-raise-doc = false
accept-no-yields-doc = false

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]  # lets mypy see that settings fields come from the environment

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pylint>=4.1.3",
    "types-pyyaml>=6.0.12.20260906",
]
