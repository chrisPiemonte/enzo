[project]
name = "enzo"
version = "0.1.0"
description = "Enzo – field service triage agent (local CLI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "a2a-sdk>=1.2.2",
    "anthropic>=1.13.0",
    "core",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "mlflow>=3.17.0",
    "ollama>=0.6.3",
    "openai>=3.28.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyfiglet>=1.0.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
enzo = "enzo.main:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enzo"

[tool.uv.sources]
core = { workspace = true }
